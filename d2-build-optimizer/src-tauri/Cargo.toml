[package]
name = "d2-build-optimizer"
version = "0.1.0"
description = "D2 Build Optimizer for Windows"
authors = ["ApexSHD"]
edition = "2021"

[lib]
name = "d2_build_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
